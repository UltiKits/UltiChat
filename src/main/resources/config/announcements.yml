# UltiChat - Announcement Configuration
# Broadcast periods are fixed: chat every 300 s, boss bar every 60 s, title every 600 s.

announcements:
  chat:
    enabled: true
    prefix: "&6[Announcement] &f"
    messages:
      - "Welcome! Type /help for assistance."
      - "Please follow server rules!"
  bossbar:
    enabled: false
    duration: 10
    color: BLUE
    messages:
      - "&eWelcome to the server!"
  title:
    enabled: false
    fade-in: 10
    stay: 70
    fade-out: 20
    messages:
      - "&6Welcome!||&7Enjoy your stay"
